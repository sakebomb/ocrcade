name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling and runtime deps
        # The tests import the runtime deps (Flask, numpy, OpenCV); without them most
        # test files skip. The Pi-only libraries are not in requirements.txt.
        run: pip install ruff pytest -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Byte-compile (catches syntax errors)
        run: |
          python -m compileall -q vision game display tests server.py daemon.py
          python -m py_compile challenges/konami_detector.py challenges/fruit_ninja_runner.py
      - name: Unit tests
        run: python -m pytest tests/ -q
