[project]
name = "ocrcade"
version = "2.0.0"
description = "Coding-arcade game: read code from a camera with a VLM, sandbox it, score teams."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "requests>=2.31",
    "PyYAML>=6.0",
    "Flask>=3.0",
    "Pillow>=10.0",
    "beautifulsoup4>=4.12",
]

# hailo_platform (Hailo-10H runtime) and picamera2 are provided by the kepler
# system image, not pip — they are intentionally not listed as dependencies.

[tool.ruff]
line-length = 100
target-version = "py311"
# vendored third-party (Hailo example apps) — not ours to lint
extend-exclude = ["challenges/hailo_apps"]
# vision/capture.py and backends/hailo_vlm.py import device-only modules lazily;
# nothing here imports them at module load, so lint stays clean off-device.

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# standalone dev scripts + tests insert the repo root on sys.path before importing
"tools/*" = ["E402"]
"tests/*" = ["E402"]
# dense direct-framebuffer rendering: long draw.text() calls read better unwrapped
"display/display_manager.py" = ["E501"]
# camera/Hailo/pygame mini-games: GStreamer require_version-before-import idiom (E402),
# dense game code; device-only, can't run off-Pi
"challenges/*.py" = ["E402", "E501", "E702"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
