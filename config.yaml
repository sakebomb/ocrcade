# OCRcade v2 configuration. Single source of truth for endpoints + thresholds.
vlm:
  # Code readers, tried in order: one that is unreachable or breaks falls through to
  # the next; one that looks and declines (bad frame) is final. Names: ollama, hailo_ocr.
  # litellm (Claude Sonnet, ~2.5 s, photos leave the Pi) first; hailo_ocr (on the Pi, ~0.5 s)
  # answers when LiteLLM is down, slow (> timeout_s), rate-limited or over budget.
  code_readers: [litellm, hailo_ocr]
  primary: ollama          # whole-card read_card only (tools/phase1_smoke.py)
  fallback: hailo          # coarse: puzzle-number + camera-challenge routing only (NOT a code reader)
  on_unreachable: degrade  # degrade = run camera challenges + routing

  ollama:
    url: "http://<gpu-host>:11434"   # optional Ollama reader; set this to your GPU host
    model: "qwen2.5vl:7b"
    num_ctx: 4096                     # MUST cap or 32K default overflows 24GB VRAM -> CPU fallback
    keep_alive: "60s"                 # load-on-demand; unloads after idle (memory-pressure friendly)
    timeout_s: 60

  hailo:
    hef: "/home/sakebomb/Qwen2-VL-2B-Instruct.hef"  # 336x336 input; coarse only
    max_tokens: 64

  litellm:     # homelab LiteLLM over Tailscale; URL + key from /etc/ocrcade/litellm.env
    model: "claude-sonnet-5-5"  # Claude Sonnet 5.5 via LiteLLM; grok-fast was blocked (HTTP 402)
    url_env: LITELLM_URL
    key_env: LITELLM_API_KEY
    timeout_s: 10               # past this, fall through to hailo_ocr (~0.5 s)

  hailo_ocr:   # PaddleOCR on the Hailo: reads code (eval reader `hailo-ocr`; tools/fetch_hailo_ocr.sh)
    det_hef: "/home/sakebomb/hailo-models/paddle_ocr_v5_mobile_detection.hef"
    rec_hef: "/home/sakebomb/hailo-models/paddle_ocr_v6_medium_recognition.hef"
    keys: "/home/sakebomb/hailo-models/ppocr_keys_v6_18710.txt"
    min_conf: 0.6    # a line whose mean character confidence is lower is dropped

gating:
  scan_fps: 4
  blur_min: 60.0          # variance-of-Laplacian; below = too blurry to read (empty scene ~13, real cards ~380; verified on device)
  stable_frames: 4        # consecutive low-diff frames before triggering a read (~1s at scan_fps)
  stable_diff_max: 8.0    # mean abs interframe diff (0-255) counted as "stable" (static scene ~0.9, verified)
  # Content fraction is a LOOSE sanity bracket, NOT the card detector. The cards are
  # light text on a DARK screen, so Otsu dark-fraction runs HIGH and overlaps an empty
  # dark scene (~0.75) -- blur does the real gating. Measured on 323 real cards: 0.13-0.94.
  min_content: 0.012      # floor: drops a fully blank bright screen (~0 dark pixels)
  max_content: 0.97       # ceiling: only drops degenerate near-solid frames (was 0.6 -> rejected 75% of real cards)
  cooldown_s: 20          # after a submission, ignore frames this long

camera:
  main_size: [2028, 1520]
  lores_size: [640, 480]
  rotate: 0               # camera points down at the table; 0/90/180/270 if the mount changes

# --- ArUco model (puzzle/lang from a marker card; team from a `# team:` line) ---
markers:
  dict: "DICT_4X4_50"   # cv2.aruco dictionary; 50 IDs, robust 4x4
  # map: {}             # optional ID -> [puzzle, lang] override; empty = default 1..21 (puzzle 0 is 19..21)

select:
  marker_stable_frames: 2   # consecutive frames a puzzle marker must be seen to select
  confirm_s: 5              # show the puzzle's task at least this long; it stays while the card is up
  settle_s: 3               # after the puzzle locks, wait before reading code
  clear_frames: 2           # and the puzzle card must be out of the frame first
  timeout_s: 60             # give up waiting for code, return to "show your card"

roster:
  cutoff: 0.6           # difflib match threshold for fuzzy team-name recovery
  names: []             # registered team names (inline). Or set `path:` to a newline file
  # path: "teams_roster.txt"

captures:               # every frame sent to a code reader, plus what it read (training data)
  enabled: true
  dir: "~/ocrcade-captures"   # <dir>/<date>/<time>-p<puzzle>-<n>.jpg + reads.jsonl
  min_free_mb: 1024     # stop saving when the disk has less free than this

readback:
  hold_s: 4.0           # Phase B: auto-submit after showing the read-back this long
  timeout_s: 30         # max wait for a confirm before returning to idle

button:                 # Phase C — physical confirm button (lgpio on Pi 5)
  mode: "auto"          # auto = AutoConfirm (no button yet); gpio = ButtonConfirm
  gpio_pin: 17          # BCM GPIO17 (header pin 11), internal pull-up, active-low

exec:
  url: "http://127.0.0.1:5000"   # the local Flask exec/display server

server:
  host: "0.0.0.0"
  port: 5000
