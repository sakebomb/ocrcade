<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCRcade Card Generator</title>
<!--
  OCRcade card generator. Teams fill in puzzle/team/lang/code, hit Render, then
  Fullscreen, and show the screen to the camera.

  The QR encodes the card identity so the reader never has to guess the team
  name or puzzle number. Payload is byte-for-byte what vision/cardspec.py parses:
      {"ocrcade":1,"p":<int>,"t":"<team>","l":"python|bash|cpp"}

  LAYOUT CONTRACT (mirrored by the reader's crop math in vision/crop.py — keep in
  sync): card area is 4:3. QR sits top-right; the code body fills the lower band.
  Proportions of the card area (W x H), origin top-left:
      QR    : right/top margin 4% of W; QR side = 22% of W  (square)
      HEADER: x [4%, 70%]  y [4%, 30%]
      CODE  : x [4%, 96%]  y [34%, 96%]   <-- the region the reader crops + deskews
  These live as CARD_LAYOUT in the reader so a change here is a change there.
-->
<script src="vendor/qrcode-generator.js"></script>
<style>
  :root { --ink:#101010; --paper:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#222; color:#eee; }
  .edit { max-width: 820px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; }
  label { display:block; margin: 14px 0 4px; font-weight:600; }
  input, select, textarea { width:100%; padding:8px; font-size:15px; border-radius:6px;
    border:1px solid #555; background:#1a1a1a; color:#eee; }
  textarea { font-family: ui-monospace, "DejaVu Sans Mono", monospace; min-height:200px;
    white-space: pre; }
  .row { display:flex; gap:14px; }
  .row > div { flex:1; }
  button { margin-top:18px; padding:10px 18px; font-size:15px; font-weight:600;
    border:0; border-radius:6px; background:#2d7; color:#012; cursor:pointer; }
  .hint { color:#aaa; font-size:13px; margin-top:6px; }
  #err { color:#f77; margin-top:10px; min-height:18px; }

  /* ---- The card the camera reads (4:3, dark ink on white) ---- */
  #card { display:none; position:relative; background:var(--paper); color:var(--ink);
    width:min(100vw, 133.333vh); height:min(75vw, 100vh); margin:0 auto; }
  #card.show { display:block; }
  #qr { position:absolute; top:4%; right:4%; width:22%; aspect-ratio:1/1; }
  #qr svg { width:100%; height:100%; display:block; }
  #header { position:absolute; left:4%; top:4%; width:66%; height:26%;
    font-family: ui-monospace, "DejaVu Sans Mono", monospace;
    font-weight:700; line-height:1.3; }
  #header .hl { font-size: clamp(18px, 3.2vw, 44px); }
  #code-out { position:absolute; left:4%; top:34%; right:4%; bottom:4%; margin:0;
    font-family: ui-monospace, "DejaVu Sans Mono", monospace;
    white-space: pre; overflow: hidden;
    font-size: clamp(18px, 3.4vw, 46px); line-height:1.35; }
  #cardbar { position:fixed; top:8px; left:8px; z-index:10; display:none; gap:8px; }
  #cardbar.show { display:flex; }
  #cardbar button { margin:0; padding:6px 12px; font-size:13px; background:#555; color:#fff; }
</style>
</head>
<body>

<div class="edit" id="editor">
  <h1>OCRcade — Card Generator</h1>
  <div class="row">
    <div>
      <label for="puzzle">Puzzle</label>
      <select id="puzzle">
        <option value="1">1 — sum the lines</option>
        <option value="2">2 — sum the lines (one-liner)</option>
        <option value="3">3 — maze path</option>
        <option value="4">4 — maze path (harder)</option>
        <option value="5">5 — Konami (camera, no code)</option>
        <option value="6">6 — Fruit Ninja (camera, no code)</option>
      </select>
    </div>
    <div>
      <label for="lang">Language</label>
      <select id="lang">
        <option value="python">python</option>
        <option value="bash">bash</option>
        <option value="cpp">cpp</option>
      </select>
    </div>
  </div>
  <label for="team">Team name</label>
  <input id="team" type="text" placeholder="e.g. Megad00mer" autocomplete="off">
  <div class="hint">The QR carries this verbatim — no more "Megad00mer vs Megadd0mer" misreads.</div>

  <label for="code">Code</label>
  <textarea id="code" spellcheck="false" placeholder="paste your solution here — indentation is preserved"></textarea>
  <div class="hint">Puzzles 5 &amp; 6 are camera challenges — leave code blank.</div>

  <button id="render">Render card →</button>
  <div id="err"></div>
</div>

<div id="cardbar">
  <button id="fs">Fullscreen</button>
  <button id="back">← Edit</button>
</div>

<div id="card">
  <div id="qr"></div>
  <div id="header"></div>
  <pre id="code-out"></pre>
</div>

<script>
"use strict";

// Mirror of vision/cardspec.encode_payload — keep byte-identical.
function buildPayload(puzzle, team, lang) {
  // object literal key order (ocrcade,p,t,l) + compact JSON == Python separators=(",",":")
  return JSON.stringify({ ocrcade: 1, p: puzzle, t: team, l: lang });
}

function renderQR(payload, mount) {
  // Use UTF-8 byte encoding so non-ASCII team names survive (lib defaults to SJIS).
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  var qr = qrcode(0, "M");          // type 0 = auto-size, error correction M
  qr.addData(payload, "Byte");
  qr.make();
  mount.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
}

function show(el, on) { el.classList.toggle("show", on); }

document.getElementById("render").addEventListener("click", function () {
  var err = document.getElementById("err");
  err.textContent = "";
  var puzzle = parseInt(document.getElementById("puzzle").value, 10);
  var lang = document.getElementById("lang").value;
  var team = document.getElementById("team").value.trim();
  var code = document.getElementById("code").value;
  if (!team) { err.textContent = "Team name is required."; return; }
  var isCamera = (puzzle === 5 || puzzle === 6);
  if (!isCamera && !code.trim()) { err.textContent = "Code is required for puzzles 1–4."; return; }

  try {
    renderQR(buildPayload(puzzle, team, lang), document.getElementById("qr"));
  } catch (e) { err.textContent = "QR error: " + e.message; return; }

  document.getElementById("header").innerHTML =
    '<div class="hl">Puzzle: ' + puzzle + '</div>' +
    '<div class="hl">Team: ' + escapeHtml(team) + '</div>' +
    '<div class="hl">Lang: ' + escapeHtml(lang) + '</div>';
  var out = document.getElementById("code-out");
  out.textContent = isCamera ? "" : code;

  document.getElementById("editor").style.display = "none";
  show(document.getElementById("card"), true);
  show(document.getElementById("cardbar"), true);
});

document.getElementById("back").addEventListener("click", function () {
  if (document.fullscreenElement) document.exitFullscreen();
  document.getElementById("editor").style.display = "";
  show(document.getElementById("card"), false);
  show(document.getElementById("cardbar"), false);
});

document.getElementById("fs").addEventListener("click", function () {
  var c = document.getElementById("card");
  if (c.requestFullscreen) c.requestFullscreen();
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
</script>
</body>
</html>
